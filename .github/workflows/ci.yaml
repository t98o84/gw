name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run tests
        run: go test -race -coverprofile=coverage.txt ./...

      # カバレッジは閾値ゲートで失敗させる前にアップロードしておく。
      # こうすることで閾値割れで CI が落ちた実行でも codecov に履歴が残り、
      # カバレッジの推移を追える。
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.txt
        continue-on-error: true

      # カバレッジ必須化のゲート。
      # 総ステートメントカバレッジが COVERAGE_THRESHOLD 未満なら CI を失敗させる。
      # この test ジョブは main のブランチ保護で必須チェックに設定されているため、
      # 下回った PR はマージできない。
      #
      # 現状はおよそ 50% を下限としてラチェット（後退防止）している。
      # 今後テストを追加しながら COVERAGE_THRESHOLD を段階的に引き上げ、
      # 最終的に 100% を目指す。カバレッジが上がったらこの値も忘れず上げること。
      - name: Enforce coverage threshold
        env:
          COVERAGE_THRESHOLD: '50'
        run: |
          total=$(go tool cover -func=coverage.txt | awk '/^total:/ {print $3}' | tr -d '%')
          echo "Total coverage: ${total}% (threshold: ${COVERAGE_THRESHOLD}%)"
          if awk -v cur="$total" -v th="$COVERAGE_THRESHOLD" 'BEGIN { exit (cur+0 < th+0) ? 0 : 1 }'; then
            echo "::error::Total coverage ${total}% is below the required threshold of ${COVERAGE_THRESHOLD}%"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build
        run: go build -v ./...

  release:
    needs: [test, lint, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release image
        run: docker build -f Dockerfile.release -t gw-release:latest .

      - name: Generate release notes with git-cliff
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace gw-release:latest sh -c '\
            git config --global --add safe.directory /workspace && \
            git-cliff --config .cliff.toml --tag "${{ github.ref_name }}"' > RELEASE_NOTES.md

      - name: Run GoReleaser
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e HOMEBREW_TAP_GITHUB_TOKEN="${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}" \
            gw-release:latest sh -c '\
            git config --global --add safe.directory /workspace && \
            goreleaser release --clean --skip=validate --release-notes /workspace/RELEASE_NOTES.md'
